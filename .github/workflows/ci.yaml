name: X-MACE tests

on:
  push:
    branches: [main, main-mace-merge]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: unit tests (not slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
      - name: Test
        run: pytest -q -m "not slow" tests

  full:
    name: all tests (training through the CLI)
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test]"
          pip install "git+https://github.com/ChengUCB/les.git@fadfb0ca3b89ed371e5de6b383f4425defabd4a8" graph_longrange schedulefree "sphericart[torch]"
      - name: Test
        run: pytest -q -n 2 tests
